<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Model</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <nav class="top-nav">
      <a href="index.html">Home</a>
      <a href="upload.html" class="active">Upload Model</a>
      <a href="predict.html">Predict</a>
    </nav>

    <h1>Upload AI Model to Pinata</h1>
    <p class="sub">Upload any type of AI model with flexible metadata and metrics.</p>

    <form id="uploadForm">
      <div class="grid">
        <label>Model Name* <input type="text" name="name" required /></label>
        <label>Creator Wallet <input type="text" name="creator" placeholder="0x..." /></label>
        <label>Category
          <select name="category">
            <option>Computer Vision</option>
            <option>Natural Language Processing</option>
            <option>Audio / Speech</option>
            <option>Tabular ML</option>
            <option>Generative AI</option>
            <option>Time Series</option>
            <option>Reinforcement Learning</option>
            <option>Multimodal</option>
          </select>
        </label>
        <label>Model Type
          <select name="model_type">
            <option>CNN</option>
            <option>Transformer</option>
            <option>RNN</option>
            <option>GAN</option>
            <option>Diffusion</option>
            <option>XGBoost</option>
            <option>Random Forest</option>
            <option>Vision Transformer</option>
            <option>YOLO</option>
            <option>U-Net</option>
          </select>
        </label>
        <label>Task Type
          <select name="task_type">
            <option>Classification</option>
            <option>Object Detection</option>
            <option>Segmentation</option>
            <option>Text Generation</option>
            <option>Text Classification</option>
            <option>Machine Translation</option>
            <option>Speech Recognition</option>
            <option>Image Generation</option>
            <option>Text-to-Image</option>
            <option>Question Answering</option>
            <option>Recommendation</option>
            <option>Forecasting</option>
          </select>
        </label>
        <label>Framework
          <select name="framework">
            <option>PyTorch</option>
            <option>TensorFlow</option>
            <option>Keras</option>
            <option>ONNX</option>
          </select>
        </label>
        <label>Input Shape <input type="text" name="input_shape" placeholder="224,224,3" /></label>
        <label>Output Labels <input type="text" name="output_labels" placeholder="daisy,rose,tulip" /></label>
        <label>Tags <input type="text" name="tags" placeholder="flowers,classification" /></label>
        <label>Price per Request (ETH) <input type="number" step="0.0001" name="price_per_request" /></label>
        <label>Payment Currency
          <select name="payment_currency">
            <option>ETH</option>
            <option>USDC</option>
            <option>MATIC</option>
          </select>
        </label>
        <label>Model Size (MB) <input type="number" step="0.01" name="model_size_mb" placeholder="96.40" /></label>
        <label>Estimated Inference Latency (ms) <input type="number" step="0.01" name="estimated_latency_ms" placeholder="45.5" /></label>
        <label class="check-inline">GPU Required <input type="checkbox" name="gpu_required" /></label>
      </div>

      <section class="metrics-section">
        <div class="metrics-header">
          <h3>Evaluation Metrics</h3>
          <button type="button" id="addMetricBtn" class="secondary-btn">+ Add Metric</button>
        </div>
        <div id="metricsContainer"></div>
      </section>

      <label>Description* <textarea name="description" required></textarea></label>
      <label>Model File* <input type="file" name="file" required /></label>

      <button type="submit">Upload Model</button>
    </form>

    <section>
      <h2>Result</h2>
      <pre id="result">No request yet.</pre>
    </section>
  </main>

  <script src="upload.js"></script>
</body>
</html>
