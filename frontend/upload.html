<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Model</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <nav class="top-nav">
      <a href="index.html">Home</a>
      <a href="upload.html" class="active">Upload Model</a>
      <a href="predict.html">Predict</a>
    </nav>

    <h1>Upload AI Model to Pinata</h1>
    <p class="sub">Upload any type of AI model with flexible metadata and metrics.</p>

    <form id="uploadForm">
      <div class="grid">
        <label>Model Name* <input type="text" name="name" required /></label>
        <label>Creator Wallet <input type="text" name="creator" placeholder="0x..." /></label>
        <label>Category
          <select name="category">
            <option>Computer Vision</option>
            <option>Natural Language Processing</option>
            <option>Audio / Speech</option>
            <option>Tabular ML</option>
            <option>Generative AI</option>
            <option>Time Series</option>
            <option>Reinforcement Learning</option>
            <option>Multimodal</option>
          </select>
        </label>
        <label>Model Type
          <select name="model_type">
            <option>CNN</option>
            <option>Transformer</option>
            <option>RNN</option>
            <option>GAN</option>
            <option>Diffusion</option>
            <option>XGBoost</option>
            <option>Random Forest</option>
            <option>Vision Transformer</option>
            <option>YOLO</option>
            <option>U-Net</option>
            <option>Basic ML</option>
          </select>
        </label>
        <label>Task Type
          <select name="task_type">
            <option>Classification</option>
            <option>Regression</option>
            <option>Object Detection</option>
            <option>Segmentation</option>
            <option>Text Generation</option>
            <option>Text Classification</option>
            <option>Machine Translation</option>
            <option>Speech Recognition</option>
            <option>Image Generation</option>
            <option>Text-to-Image</option>
            <option>Question Answering</option>
            <option>Recommendation</option>
            <option>Forecasting</option>
          </select>
        </label>
        <label>Input Type
          <select name="input_type" id="inputType">
            <option value="Image tensor">Image tensor</option>
            <option value="Tabular numeric features">Tabular numeric features</option>
            <option value="Tabular mixed features (numeric/text)">Tabular mixed features (numeric/text)</option>
            <option value="Text string">Text string</option>
            <option value="Prompt text">Prompt text</option>
            <option value="Audio waveform/features">Audio waveform/features</option>
            <option value="Time-series window">Time-series window</option>
            <option value="Question + context text">Question + context text</option>
            <option value="Noise vector / condition">Noise vector / condition</option>
          </select>
        </label>
        <label>Output Type
          <select name="output_type" id="outputType">
            <option value="Class probabilities (multi-class)">Class probabilities (multi-class)</option>
            <option value="Class probabilities (binary)">Class probabilities (binary)</option>
            <option value="Single continuous numeric value">Single continuous numeric value</option>
            <option value="Bounding boxes + class scores">Bounding boxes + class scores</option>
            <option value="Pixel-wise mask">Pixel-wise mask</option>
            <option value="Generated text">Generated text</option>
            <option value="Generated image">Generated image</option>
            <option value="Translated text">Translated text</option>
            <option value="Answer span/text">Answer span/text</option>
            <option value="Ranked item scores">Ranked item scores</option>
            <option value="Future value(s)">Future value(s)</option>
          </select>
        </label>
        <label>Framework
          <select name="framework">
            <option>PyTorch</option>
            <option>TensorFlow</option>
            <option>Keras</option>
            <option>ONNX</option>
          </select>
        </label>
        <input type="hidden" name="input_shape" id="inputShape" value="" />
        <input type="hidden" name="output_labels" id="outputLabels" value="" />
        <input type="hidden" name="feature_columns" id="featureColumns" value="" />
        <input type="hidden" name="feature_types" id="featureTypes" value="" />
        <input type="hidden" name="target_column" id="targetColumn" value="" />
        <label>Tags <input type="text" name="tags" placeholder="flowers,classification" /></label>
        <label>Price per Request (ETH) <input type="number" step="0.0001" name="price_per_request" /></label>
        <label>Payment Currency
          <select name="payment_currency">
            <option>ETH</option>
            <option>USDC</option>
            <option>MATIC</option>
          </select>
        </label>
        <label>Model Size (MB) <input type="number" step="0.01" name="model_size_mb" placeholder="96.40" /></label>
        <label>Estimated Inference Latency (ms) <input type="number" step="0.01" name="estimated_latency_ms" placeholder="45.5" /></label>
        <label class="check-inline">GPU Required <input type="checkbox" name="gpu_required" /></label>
      </div>

      <section class="metrics-section">
        <div class="metrics-header">
          <h3>Evaluation Metrics</h3>
          <button type="button" id="addMetricBtn" class="secondary-btn">+ Add Metric</button>
        </div>
        <div id="metricsContainer"></div>
      </section>

      <label>Description* <textarea name="description" required></textarea></label>
      <label>Model File* <input type="file" name="file" required /></label>

      <button type="submit">Upload Model</button>
    </form>

    <section>
      <h2>Result</h2>
      <pre id="result">No request yet.</pre>
    </section>
  </main>

  <script src="upload.js"></script>
</body>
</html>
